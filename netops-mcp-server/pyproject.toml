[project]
name = "netops-mcp-server"
version = "0.1.0"
description = "Combined MCP server for netops-stack: NetBox, Prometheus, ClickHouse, GitLab, IOS-XE (<50 tools)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.6",
    "pyjwt>=2.12.0",  # GHSA: override transitive PyJWT (crit header); Dependabot alert #1
    "cryptography>=50.0.0",  # CVE-2026-69247 and prior crypto CVEs (transitive via paramiko / PyJWT)
    "paramiko>=5.0.0",  # CVE-2026-44405 (transitive via netmiko)
    "python-multipart>=0.0.32",  # CVE-2026-40347 (transitive via Starlette/FastMCP)
    "starlette>=1.4.1",  # CVE-2026-54283, CVE-2026-48818 (transitive via FastMCP / sse-starlette)
    "mcp>=2.0.0",  # CVE-2026-59950, CVE-2026-52869/52870 (transitive via FastMCP)
    "pydantic-settings>=2.15.0",  # GHSA-4xgf-cpjx-pc3j (transitive via FastMCP / mcp)
    "pygments>=2.20.0",  # CVE-2026-4539 (transitive via pytest rich output)
    "httpx>=0.24",
    "requests>=2.34.2",
    "netmiko>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff"]  # CVE-2025-71176 fixed in 9.0.3

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netops_mcp_server"]
